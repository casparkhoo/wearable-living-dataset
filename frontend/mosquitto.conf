# Mosquitto broker configuration for Wearable Sensor Dashboard
# Enables both standard MQTT (for Android app) and WebSocket MQTT (for browser dashboard)

# Standard MQTT listener — Android app publishes here
listener 1883
allow_anonymous true

# WebSocket listener — browser dashboard subscribes here
listener 9001
protocol websockets
allow_anonymous true

# Logging
log_type error
log_type warning
log_type notice
