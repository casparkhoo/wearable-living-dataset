# Broker for the local stack. Same rules as the cloud broker: no anonymous
# access, one account per participant (written by broker-accounts), and the
# ACL limits each account to its own topics.
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
allow_anonymous false
password_file /mosquitto/accounts/passwordfile
acl_file /mosquitto/config/aclfile

# Plain MQTT, for the backend and for scripts on this computer.
listener 1883 0.0.0.0

# WebSockets, which the phone app uses through the gateway's /mqtt route.
listener 9001 0.0.0.0
protocol websockets
