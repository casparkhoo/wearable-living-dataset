# The TCP listener is internal to the Docker network. The WebSocket listener is
# exposed through Caddy as wss://$MQTT_DOMAIN/mqtt (see the Caddyfile).
persistence true
persistence_location /mosquitto/data/
log_dest stdout
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwordfile
acl_file /mosquitto/config/aclfile
listener 9001 0.0.0.0
protocol websockets
allow_anonymous false
password_file /mosquitto/config/passwordfile
acl_file /mosquitto/config/aclfile
